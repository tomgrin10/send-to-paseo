<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send to Paseo — settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --fg: #16181d;
        --muted: #676e79;
        --border: #d7dae0;
        --border-strong: #c2c7d0;
        --accent: #5b57e0;
        --accent-hover: #4a46d4;
        --accent-fg: #ffffff;
        --ok: #0b7a4b;
        --ok-bg: #eefaf3;
        --ok-border: #b8e6cd;
        --bad: #b42318;
        --bad-bg: #fef3f2;
        --bad-border: #fbcfc9;
        --warn: #92500e;
        --warn-bg: #fff8eb;
        --warn-border: #f5dda6;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171b;
          --card: #1d2025;
          --fg: #e7e9ec;
          --muted: #98a0ab;
          --border: #383e46;
          --border-strong: #4a515b;
          --accent: #7d78ff;
          --accent-hover: #8f8bff;
          --accent-fg: #12131a;
          --ok: #6ddba2;
          --ok-bg: #14261e;
          --ok-border: #2b4d3a;
          --bad: #ff9b92;
          --bad-bg: #2e1c1a;
          --bad-border: #57302c;
          --warn: #f2c169;
          --warn-bg: #2a2213;
          --warn-border: #524126;
        }
      }
      * { box-sizing: border-box; }
      /* An author `display` rule beats the UA stylesheet's [hidden]{display:none},
         so .row below would otherwise defeat the hidden attribute. */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        padding: 32px 20px 60px;
        background: var(--bg);
        color: var(--fg);
        font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 620px; margin: 0 auto; display: grid; gap: 18px; }
      h1 { font-size: 19px; margin: 0; display: flex; align-items: center; gap: 9px; }
      h1 svg { width: 20px; height: 20px; color: var(--accent); }
      .sub { color: var(--muted); font-size: 13px; margin: -10px 0 0; }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        display: grid;
        gap: 14px;
      }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
      label.field { display: grid; gap: 5px; }
      label.field > .lbl { font-weight: 600; font-size: 12.5px; }
      label.field > .help { color: var(--muted); font-size: 12px; }
      select {
        width: 100%;
        height: 32px;
        padding: 0 6px;
        font: 400 13px/1 inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
      input[type="text"], input[type="password"] {
        width: 100%;
        height: 32px;
        padding: 0 9px;
        font: 400 13px/1 var(--mono);
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > input { flex: 1; }
      button {
        height: 32px;
        padding: 0 13px;
        font: 600 12.5px/1 inherit;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover { background: var(--bg); border-color: var(--border-strong); }
      button.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
      button.primary:hover { background: var(--accent-hover); }
      button[disabled] { opacity: 0.55; cursor: default; }
      .status {
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        display: grid;
        gap: 3px;
        border: 1px solid var(--border);
        background: var(--bg);
      }
      .status[data-tone="ok"] { color: var(--fg); background: var(--ok-bg); border-color: var(--ok-border); }
      .status[data-tone="bad"] { color: var(--fg); background: var(--bad-bg); border-color: var(--bad-border); }
      .status[data-tone="warn"] { color: var(--fg); background: var(--warn-bg); border-color: var(--warn-border); }
      .status[data-tone="warn"] .st { color: var(--warn); }
      .status .st { font-weight: 600; }
      .status[data-tone="ok"] .st { color: var(--ok); }
      .status[data-tone="bad"] .st { color: var(--bad); }
      .status .sd, .status .sh { color: var(--muted); font-size: 12.5px; }
      .status code { font: 500 12px/1 var(--mono); }
      .saved { color: var(--ok); font-size: 12px; font-weight: 600; visibility: hidden; }
      .saved[data-on="1"] { visibility: visible; }
      footer { color: var(--muted); font-size: 12px; text-align: center; }
      footer code { font: 500 11.5px/1 var(--mono); }
      .spinner {
        width: 12px; height: 12px; display: inline-block; vertical-align: -1px;
        border: 2px solid var(--border-strong); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 700ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M1.8 7.2 13.4 2.1a.55.55 0 0 1 .74.72L9.3 14.2a.55.55 0 0 1-1.02-.05L6.7 9.7 2.0 8.2a.55.55 0 0 1-.2-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        Send to Paseo
      </h1>
      <p class="sub">
        Pairs this extension with the <code>send-to-paseo</code> Paseo plugin's local bridge.
      </p>

      <section>
        <h2>Bridge</h2>
        <label class="field">
          <span class="lbl">Bridge URL</span>
          <span class="help">The plugin binds 127.0.0.1 only. Default <code>http://127.0.0.1:7788</code>.</span>
          <input id="bridgeUrl" type="text" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:7788" />
        </label>
        <div class="row" id="grantRow" hidden>
          <button id="grant" type="button">Grant access to this address</button>
          <span class="help" id="grantHelp"></span>
        </div>
        <label class="field">
          <span class="lbl">Pairing token</span>
          <span class="help">
            Copy it from Paseo → send-to-paseo → Pairing token. Stored in extension
            storage and only ever read by the service worker.
          </span>
          <div class="row">
            <input id="token" type="password" spellcheck="false" autocomplete="off" placeholder="paste token" />
            <button id="reveal" type="button">Show</button>
            <button id="clear" type="button">Clear</button>
          </div>
        </label>
      </section>

      <section>
        <h2>Defaults</h2>
        <label class="field">
          <span class="lbl">Default provider</span>
          <span class="help">
            The list comes from the bridge — <code>GET /v1/ping</code> with your token returns
            every provider Paseo has configured. Run <b>Test connection</b> to refresh it.
          </span>
          <select id="defaultProvider" aria-label="Default provider">
            <option value="">(use the plugin's default)</option>
          </select>
          <span class="help" id="providerHelp"></span>
        </label>
      </section>

      <section>
        <h2>Connection</h2>
        <div class="row">
          <button id="test" class="primary" type="button">Test connection</button>
          <span class="saved" id="saved">Saved</span>
        </div>
        <div class="status" id="status" data-tone="idle">
          <span class="st">Not tested yet</span>
          <span class="sd">Test connection calls <code>GET /v1/ping</code> on the bridge.</span>
        </div>
      </section>

      <footer>
        Settings save as you type. Troubleshooting lives in <code>extension/README.md</code>.
      </footer>
    </main>
    <script src="options.js"></script>
  </body>
</html>
