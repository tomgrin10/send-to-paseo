name: Publish plugin to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify release and publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.20.0
      - name: Require the tag to match plugin package.json
        working-directory: plugin
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci
      - name: Verify plugin
        working-directory: plugin
        run: npm run verify
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Install Chromium
        working-directory: extension
        run: npx playwright-core install --with-deps chromium
      - name: Verify extension
        working-directory: extension
        run: STP_CHROMIUM="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" npm run verify
      - name: Inspect plugin package
        working-directory: plugin
        run: npm pack --dry-run
      - name: Publish plugin
        working-directory: plugin
        run: npm publish --access public
