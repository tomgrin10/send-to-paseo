name: Release plugin and extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify release and publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.20.0
      - name: Require the tag to match every release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs
      - name: Test publishing failure and retry handling
        run: node --test test/chrome-web-store.test.mjs
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci
      - name: Verify plugin
        working-directory: plugin
        run: npm run verify
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Install Chromium
        working-directory: extension
        run: npx playwright-core install --with-deps chromium
      - name: Verify extension
        working-directory: extension
        run: STP_CHROMIUM="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" npm run verify
      - name: Inspect plugin package
        working-directory: plugin
        run: npm pack --dry-run
      - name: Package the shipping extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-release
          path: dist/send-to-paseo-extension.zip
          if-no-files-found: error
      - name: Publish plugin
        working-directory: plugin
        run: npm publish --access public

  release:
    name: Create GitHub release with extension ZIP
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-release
          path: dist
      - name: Create release and attach verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/send-to-paseo-extension.zip --clobber

  chrome:
    name: Submit extension to Chrome Web Store
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-chrome.yml
    with:
      tag: ${{ github.ref_name }}
